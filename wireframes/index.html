<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P4Pair wireframes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e4e8e7; color: #172123; font: 15px system-ui, sans-serif; }
    main { width: min(1100px, calc(100% - 32px)); margin: auto; padding: 40px 0 64px; }
    h1 { margin: 0; font-size: 32px; } p { color: #657174; }
    .screens { display: grid; gap: 32px; margin-top: 32px; }
    .screen { border: 1px solid #7d898a; background: #fff; }
    .label { padding: 10px 14px; border-bottom: 1px solid #aab4b3; background: #f1f3f2; font-weight: 700; }
    .landing { display: grid; grid-template-columns: 1.2fr .8fr; gap: 48px; padding: 56px; }
    .hero { height: 48px; width: 85%; margin: 20px 0; background: #cbd1d0; }
    .copy { height: 14px; margin: 10px 0; background: #e2e5e4; }
    .route { display: flex; align-items: center; margin-top: 48px; }
    .node { width: 48px; height: 48px; border: 2px solid #394546; border-radius: 50%; }
    .line { height: 3px; flex: 1; background: #2755d9; }
    .panel { padding: 24px; border: 1px solid #7d898a; }
    .button { height: 48px; margin: 18px 0; background: #2755d9; }
    .input { height: 48px; border: 1px solid #7d898a; }
    .app-head, .rail, .chat-head, .composer { border-bottom: 1px solid #aab4b3; }
    .app-head { height: 64px; }
    .rail { display: flex; height: 76px; align-items: center; padding: 0 28px; }
    .rail .node { width: 36px; height: 36px; }
    .workspace { display: grid; min-height: 460px; grid-template-columns: 1fr 280px; }
    .chat { display: grid; grid-template-rows: 60px 1fr 66px; }
    .chat-head { background: #fafafa; }
    .messages { padding: 28px; }
    .bubble { width: 44%; height: 70px; margin: 12px 0; border: 1px solid #9ba5a4; }
    .bubble.out { margin-left: auto; background: #e1e8ff; }
    .composer { border-top: 1px solid #aab4b3; border-bottom: 0; }
    .diagnostics { padding: 18px; border-left: 1px solid #aab4b3; background: #edf0ef; }
    .event { height: 42px; margin: 12px 0; border-left: 2px solid #778383; }
    @media (max-width: 700px) {
      .landing { grid-template-columns: 1fr; padding: 28px; }
      .workspace { grid-template-columns: 1fr; }
      .diagnostics { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>P4Pair interaction wireframes</h1>
    <p>The route between two browser endpoints remains visible from room creation through chat.</p>
    <div class="screens">
      <section class="screen">
        <div class="label">Landing and room entry</div>
        <div class="landing">
          <div>
            <div class="hero"></div><div class="copy"></div><div class="copy"></div>
            <div class="route"><span class="node"></span><span class="line"></span><span class="node"></span></div>
          </div>
          <div class="panel"><div class="copy"></div><div class="button"></div><div class="input"></div></div>
        </div>
      </section>
      <section class="screen">
        <div class="label">Connected conversation</div>
        <div class="app-head"></div>
        <div class="rail"><span class="node"></span><span class="line"></span><span class="node"></span></div>
        <div class="workspace">
          <div class="chat"><div class="chat-head"></div><div class="messages"><div class="bubble"></div><div class="bubble out"></div></div><div class="composer"></div></div>
          <aside class="diagnostics"><div class="event"></div><div class="event"></div><div class="event"></div></aside>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
